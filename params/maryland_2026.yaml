# Maryland Benefits Cliff Model: parameters
# Every number has a source. When rules change, update this file, not the code.
# "null  # TODO" marks values still to be filled in later sessions.

meta:
  location: Baltimore City
  rules_as_of: "2026-11-17"

# ---------- Housing (needed for the SNAP shelter deduction) ----------
housing:
  rent_monthly: 1955                # TODO: replace with Baltimore 2-bedroom Fair Market Rent
  source: https://nlihc.org/sites/default/files/oor/2026-OOR-MD.pdf

# ---------- Federal Poverty Level (annual) ----------
fpl:
  year: 2026
  first_person: 15960
  each_additional_person: 5680
  source: https://www.govinfo.gov/content/pkg/FR-2026-01-15/html/2026-00755.htm  # verified

# ---------- SNAP (monthly amounts, effective 2026-10-01) ----------
snap:
  gross_limit_pct_fpl: 200          # Maryland broad-based categorical eligibility
  benefit_reduction_rate: 0.30      # benefit = max allotment - 30% of net income
  earned_income_deduction: 0.20     # 20% of earnings
  min_benefit: 25                   # for households of 1-2 people
  min_benefit_max_size: 2
  max_excess_shelter: 769
  standard_utility_allowance: 592
  standard_deduction:
    1: 217
    2: 217
    3: 217
    4: 229
    5: 268
    6: 308
  max_benefit:                      # corrected from USDA FY2027 table
    1: 306
    2: 562
    3: 808
    4: 1023
    5: 1217
    6: 1463
  gross_limit_monthly:
    1: 2660
    2: 3607
    3: 4553
    4: 5500
    5: 6447
    6: 7393
  sources:
    max_benefit_and_deductions: https://www.usda.gov/sites/default/files/guidance-documents/fna.snap-cola2027.pdf
    maryland_standards: https://dhs.maryland.gov/documents/FIA/Manuals/Supplemental%20Nutrition%20Assistance%20Program%20(SNAP)/600%20Standards/600%20Standards%20for%20Income%20and%20Deductions%20SEPT%202026.pdf
    income_limits: https://dhs.maryland.gov/documents/FIA/Manuals/Supplemental%20Nutrition%20Assistance%20Program%20(SNAP)/115%20Categorical%20Eligibility/October%202026%20Income%20Guidelines-%20revised%209.2026.pdf

# ---------- Medicaid and MCHP (limits as % of FPL) ----------
medicaid:
  adult_limit_pct_fpl: 138
  child_medicaid_limit_pct_fpl:
    under_1: 199
    age_1_to_5: 143
    age_6_to_18: 138
  mchp_free_limit_pct_fpl: 211      # MCHP with no premium
  mchp_premium_limit_pct_fpl: 322   # MCHP Premium, above 211% up to 322%
  mchp_premium_monthly:             # per family: [up to % FPL, $ per month]
    - [264, 54]                     # approximate: 2017 MDH chart
    - [322, 67]                     # approximate: 2017 MDH chart
  sources:
    limits: https://health.maryland.gov/mmcp/Coverage%20Groups/coverage-group-quick-reference-guide.pdf
    premiums: https://health.maryland.gov/mmcp/Medicaid%20Applications/MCHP%20Premium%20Manual%20Revised%209-2017.pdf

# ---------- Child Care Scholarship ----------
childcare:
  new_enrollment_frozen: true       # frozen since 2025-05-01; model both cases
  initial_income_limit:             # annual; family of 4 verified (Banner, 2026)
    2: 76116                        # estimate: 68% of family-of-4 limit
    3: 94026                        # estimate: 84% of family-of-4 limit
    4: 111936                       # verified
  continuing_income_limit: null     # TODO: not published; model uses initial limit
  price_weekly:                     # Baltimore City centers, Maryland Family Network 2025
    preschool: 302.22               # ages 2-4
    school_age: 191.15              # before and after school
  preschool_max_age: 4
  school_age_max_age: 12
  copay:                            # new scale approved Aug 2026, starts 2027 at the earliest
    current_weekly_range: [1, 3]    # typical copay today, for comparison
    free_at_or_below_pct_fpl: 100
    free_if_receiving_snap: true    # also free with housing voucher, SSI, TCA, WIC
    lowest_weekly: 10.58
    highest_weekly: 106.74
    cap_pct_income: 0.07
    method: linear_placeholder      # TODO: replace with real tiers from Model A
  sources:
    prices: https://www.marylandfamilynetwork.org/sites/default/files/2025-03/BaltimoreCity.pdf
    income_and_copay: https://www.thebanner.com/education/early-childhood/maryland-child-care-scholarship-copayments-VOXG2JYMQBCTVBCTNONYWG3TKY/
    copay_model: https://marylandpublicschools.org/stateboard/Documents/2026/0825/Child-Care-Scholarship-Copayment-Model-A.pdf
    old_income_scale: https://earlychildhood.marylandpublicschools.org/system/files/filedepot/2/income_eligibility_scale.pdf
    freeze: https://dhs.maryland.gov/documents/FIA/Action%20Transmittals-AT%20-%20Information%20Memo-IM/AT-IM2026/26-07%20AT%20Child%20Care%20Scholarship%20Program%20Enrollment%20Freeze%20Updated%20Application%20Procedures%202.pdf

# ---------- Federal taxes and credits (tax year 2026) ----------
federal_tax:
  fica_rate: 0.0765
  standard_deduction:
    head_of_household: 24150
    married_joint: 32200
  brackets_head_of_household:       # [income above, rate]
    - [0, 0.10]
    - [17700, 0.12]
    - [67450, 0.22]
  brackets_married_joint:
    - [0, 0.10]
    - [24800, 0.12]
    - [100800, 0.22]
  child_tax_credit_per_child: 2200
  ctc_max_child_age: 16             # child must be under 17 at year end
  ctc_refundable_max_per_child: 1700
  ctc_refundable_earnings_floor: 2500   # refundable part starts above $2,500 earned
  ctc_refundable_rate: 0.15             # 15 cents per dollar above the floor
  eitc:                             # by number of children (3 = three or more)
    max_children_counted: 3
    max_credit:      {1: 4427, 2: 7316, 3: 8231}
    phase_in_end:    {1: 13020, 2: 18290, 3: 18290}
    phaseout_start_single: 23890
    phaseout_start_joint: 31160
    phaseout_end_single: {1: 51593, 2: 58629, 3: 62974}
    phaseout_end_joint:  {1: 58863, 2: 65899, 3: 70224}
  sources:
    irs: https://www.irs.gov/newsroom/irs-releases-tax-inflation-adjustments-for-tax-year-2026-including-amendments-from-the-one-big-beautiful-bill
    eitc_table: Rev. Proc. 2025-32
    ctc_refundable: https://www.kiplinger.com/taxes/child-tax-credit-faqs

# ---------- Maryland taxes and credits ----------
maryland_tax:
  standard_deduction:
    single: 3350
    joint_or_head_of_household: 6700
  brackets_joint_or_head_of_household:
    - [0, 0.02]
    - [1000, 0.03]
    - [2000, 0.04]
    - [3000, 0.0475]
    - [150000, 0.05]
  local_rate_baltimore_city: 0.032
  eitc_pct_of_federal: 0.45         # verified: refundable, families with children (Tax Policy Center)
  local_eitc: null                  # not modeled: nonrefundable, small at these incomes
  personal_exemption: 3200          # per person; full amount below $150,000 for joint/head of household
  sources:
    rates: https://www.marylandcomptroller.gov/content/dam/mdcomp/md/state-payroll/memos/2026/2026-maryland-state-and-local-withholding-information.pdf
    deduction: https://www.marylandcomptroller.gov/content/dam/mdcomp/tax/legal-publications/alerts/tax-alert-changes-to-standard-and-itemized-deductions-and-to-state-and-local-income-tax-rates-from-the-2025-legislative-session.pdf
    eitc: https://www.marylandcomptroller.gov/content/dam/mdcomp/md/state-payroll/memos/2025/2025-earned-income-tax-credit.pdf
    eitc_rate: https://taxpolicycenter.org/sites/default/files/2026-07/state_eitc_rates.pdf
    exemption: https://www.marylandcomptroller.gov/content/dam/mdcomp/md/state-payroll/memos/2026/payroll-changes-effective-january-1-2026.pdf
